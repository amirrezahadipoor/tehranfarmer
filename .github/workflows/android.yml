name: Android APK

# ساخت واقعی APK از طریق GitHub Actions (بدون نیاز به اندروید استودیو روی سیستم شما)
# خروجی‌ها: debug APK (همیشه، با ابزار تست) و release APK (امضاشده اگر Secrets تنظیم شده باشد)
# اجرا: خودکار روی هر push به main و روی تگ v*، یا دستی از تب Actions -> Run workflow
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_release:
        description: 'ساخت نسخهٔ release هم انجام شود؟'
        type: boolean
        default: true

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: ساخت و بارگذاری APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: دریافت کد منبع
        uses: actions/checkout@v4

      - name: راه‌اندازی Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: راه‌اندازی Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: کش Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: نصب Android SDK 35 و Build-Tools 35.0.0
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: نصب وابستگی‌های npm
        run: npm ci

      - name: گیت کیفیت (تایپ، متن فارسی، حریم خصوصی، تست‌ها، بیلد، تک‌فایل آفلاین، ممیزی)
        run: npm run check

      # ---- کلید امضا: اگر Secrets تنظیم شده باشد، release امضاشده ساخته می‌شود ----
      - name: بازیابی کلید امضا از Secrets (اختیاری)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "[OK] کلید امضا از Secrets بازیابی شد."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "[i] Secret اندروید تنظیم نشده؛ APK نسخهٔ debug و release بدون امضا ساخته می‌شود."
          fi

      - name: ساخت APK نسخهٔ debug (همیشه)
        run: npm run android:debug

      - name: ساخت APK نسخهٔ release (در صورت درخواست یا وجود کلید)
        if: ${{ github.event_name == 'push' || inputs.build_release }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          REQUIRE_SIGNED_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
        run: npm run android:release

      - name: پاک‌سازی فوری کلید موقت
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: بازرسی خودکار باینری APK (ساختار، امضای v2/v3، مانیفست)
        run: |
          if [ "${{ github.event_name == 'push' || inputs.build_release }}" = "true" ]; then
            npm run android:verify
          else
            npm run android:verify -- artifacts/mazrae-rangi-debug.apk
          fi

      - name: بارگذاری APK نسخهٔ debug
        uses: actions/upload-artifact@v4
        with:
          name: mazrae-rangi-debug-apk
          path: artifacts/mazrae-rangi-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: بارگذاری APK نسخهٔ release
        uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'push' || inputs.build_release }}
        with:
          name: mazrae-rangi-release-apk
          path: |
            artifacts/mazrae-rangi-release.apk
            artifacts/mazrae-rangi-release-unsigned.apk
          if-no-files-found: error
          retention-days: 90

      - name: بارگذاری نسخهٔ تک‌فایل وب آفلاین (نصب‌شدنی روی هر گوشی)
        uses: actions/upload-artifact@v4
        with:
          name: mazrae-rangi-web-singlefile
          path: dist/index.html
          if-no-files-found: error
          retention-days: 30

      - name: خلاصهٔ خروجی در صفحهٔ اجرا
        if: always()
        run: |
          {
            echo "## خروجی ساخت اندروید"
            echo ""
            ls -lh artifacts 2>/dev/null | sed 's/^/    /' || echo "پوشهٔ artifacts ساخته نشد."
            echo ""
            echo "- debug: با ابزارهای تست (F9) ساخته می‌شود و صرفاً برای آزمون است."
            echo "- release: بیلد production واقعی؛ ابزارهای توسعه در آن حذف شده‌اند."
            echo "- اگر Secret های امضا تنظیم شوند، فایل release با کلید خودتان امضا و با apksigner تأیید می‌شود."
            echo "- فایل release-unsigned فقط برای آزمون است؛ تگ رسمی بدون امضا شکست می‌خورد."
          } >> "$GITHUB_STEP_SUMMARY"
