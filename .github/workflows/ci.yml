name: CI

# تنها گردش‌کار کیفیت وب + تست بصری. ساخت APK در گردش‌کار «Android APK» انجام می‌شود.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: تایپ، متن فارسی، حریم خصوصی، تست‌ها، بیلد و ممیزی سرتاسری
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: گیت کامل کیفیت
        run: npm run check
      - name: شبیه‌ساز بالانس اقتصادی (سخت‌گیرانه)
        run: STRICT=1 RUNS=3 npm run sim:balance
      - name: شبیه‌ساز داستان (سخت‌گیرانه)
        run: STRICT=1 RUNS=2 npm run sim:story
      - name: بارگذاری گزارش بالانس
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balance-report
          path: |
            docs/BALANCE-REPORT.md
            docs/balance-report.json
          if-no-files-found: warn
          retention-days: 14

  visual:
    name: آزمون بصری واقعی مرورگر (موبایل/تبلت/دسکتاپ + خوانایی فونت)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: نصب مرورگر Chromium
        run: npx playwright install --with-deps chromium
      - name: آزمون بصری (بیلد مخصوص E2E + اسپک‌ها)
        run: npm run test:visual
      - name: بارگذاری اسکرین‌شات‌ها و گزارش
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-report
          path: |
            test-results/
            playwright-report/
            e2e/__screenshots__/
          if-no-files-found: warn
          retention-days: 14
